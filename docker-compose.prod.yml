# Bản chạy trên VPS: dùng image build sẵn từ GitHub Actions (GHCR), không build tại chỗ.
# Truy cập: https://nhuhodethuong.duckdns.org — Caddy (stack thansohoc) proxy sang xiaoxinstock-app-1:3001.
# GitHub Actions copy file này vào /opt/xiaoxinstock rồi chạy deploy/remote-deploy.sh.
# Cần sẵn trên VPS: /opt/xiaoxinstock/.env (mật khẩu DB, tài khoản, SESSION_SECRET).
# Chạy máy local / LAN thì vẫn dùng docker-compose.yml.
name: xiaoxinstock

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xiaoxin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-xiaoxin}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Tên riêng: app còn nằm trong mạng thansohoc_default, nơi "db" là Postgres của thansohoc.
    networks:
      default:
        aliases:
          - xiaoxinstock-db
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${IMAGE_REPO:?Đặt IMAGE_REPO}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xiaoxin}:${POSTGRES_PASSWORD}@xiaoxinstock-db:5432/${POSTGRES_DB:-xiaoxin}
      APP_USERNAME: ${APP_USERNAME:?Đặt APP_USERNAME trong .env}
      APP_PASSWORD: ${APP_PASSWORD:?Đặt APP_PASSWORD trong .env}
      SESSION_SECRET: ${SESSION_SECRET:?Đặt SESSION_SECRET trong .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: Asia/Ho_Chi_Minh
    # Chỉ mở trong VPS; người dùng vào qua Caddy (HTTPS) ở mạng thansohoc_default.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:3001"
    networks:
      - default
      - thansohoc_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pgdata:

networks:
  thansohoc_net:
    external: true
    name: thansohoc_default
