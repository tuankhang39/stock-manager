services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xiaoxin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-xiaoxin}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Mở cổng 5433 trên máy (5432 có thể đang dùng cho PostgreSQL cài sẵn) — chỉ cho máy này
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-xiaoxin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xiaoxin}
      APP_USERNAME: ${APP_USERNAME:?Đặt APP_USERNAME trong .env}
      APP_PASSWORD: ${APP_PASSWORD:?Đặt APP_PASSWORD trong .env}
      SESSION_SECRET: ${SESSION_SECRET:?Đặt SESSION_SECRET trong .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${APP_PORT:-8080}:3001"

volumes:
  pgdata:
